name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting (black)
        run: black --check --diff sales_analysis.py conftest.py tests/

      - name: Lint (flake8)
        run: flake8 sales_analysis.py conftest.py tests/

      - name: Run tests
        run: pytest tests/ -v